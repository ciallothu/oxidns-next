log:
  level: error

plugins:
  - tag: bench_domain_set
    type: domain_set
    args:
      files:
        - "./.generated/common-domains.txt"

  - tag: bench_hit_answer
    type: arbitrary
    args:
      files:
        - "./.generated/common-domain-hit-answers.zone"

  - tag: bench_miss_answer
    type: arbitrary
    args:
      rules:
        - "semantic-miss.invalid. 60 IN A 192.0.2.54"

  - tag: seq_main
    type: sequence
    args:
      - matches: ["qname $bench_domain_set"]
        exec: $bench_hit_answer
      - exec: $bench_miss_answer
      - matches: ["has_resp"]
        exec: accept
      - exec: reject 3

  - tag: udp_server
    type: udp_server
    args:
      entry: "seq_main"
      listen: "127.0.0.1:5351"
